name: Probe reusable review

on:
  workflow_call:
    inputs:
      probe-url:
        description: Public URL of a reviewed Linux amd64 Probe tar.gz release archive
        type: string
        required: true
      probe-sha256:
        description: Reviewed SHA-256 of that archive
        type: string
        required: true
      base-sha:
        type: string
        default: ''
      head-sha:
        type: string
        default: ''
      reviewer:
        description: Enable the configured provider (disabled for fork PRs)
        type: boolean
        default: false
      enforce:
        description: Fail on reproduced blockers or operational errors; code 2 still needs PR approval
        type: boolean
        default: false
      sandbox-image:
        type: string
        default: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
    secrets:
      reviewer-api-key:
        required: false
    outputs:
      exit-code:
        description: Probe result, including 2 for human review required
        value: ${{ jobs.review.outputs.exit-code }}

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      exit-code: ${{ steps.review.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted Probe binary
        shell: bash
        env:
          PROBE_URL: ${{ inputs.probe-url }}
          PROBE_SHA256: ${{ inputs.probe-sha256 }}
        run: |
          set -euo pipefail
          [[ "$PROBE_URL" == https://* ]] || exit 1
          [[ "$PROBE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || exit 1
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o probe.tar.gz "$PROBE_URL"
          printf '%s  probe.tar.gz\n' "$PROBE_SHA256" | sha256sum --check
          mkdir probe-bin
          tar -xzf probe.tar.gz -C probe-bin --strip-components=1
          test -x probe-bin/probe
          echo "$RUNNER_TEMP/probe-bin" >> "$GITHUB_PATH"
      - name: Preload the trusted test image
        env:
          IMAGE: ${{ inputs.sandbox-image }}
        run: |
          docker pull "$IMAGE"
          # Bootstrap PRs may predate the repository's pinned policy.
          docker tag "$IMAGE" golang:1.26-bookworm
      - name: Review immutable PR commits
        id: review
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha || github.sha }}
          USE_REVIEWER: ${{ inputs.reviewer && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          PROBE_API_KEY: ${{ secrets.reviewer-api-key }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full base/head commit SHAs are required.' >&2; exit 3; }
          output="$RUNNER_TEMP/probe-report"
          set +e
          probe review --base "$BASE_SHA" --head "$HEAD_SHA" --ci \
            --reviewer="$USE_REVIEWER" --out "$output"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf 'Probe exit code: %s\n\n' "$code" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$output/CONFIDENCE_REPORT.md" ]]; then
            cat "$output/CONFIDENCE_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$code" == 2 ]]; then
            echo '::warning::Probe requests human review. Inspect the report before approving this PR.'
          fi
      - name: Preserve report and reproducing tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Apply blocking policy
        if: always() && inputs.enforce
        env:
          CODE: ${{ steps.review.outputs.code }}
        run: |
          case "$CODE" in
            0|2) exit 0 ;;
            *) echo 'Probe failed or found a reproduced blocker.' >&2; exit 1 ;;
          esac
